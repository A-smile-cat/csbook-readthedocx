# Read the Docs 构建配置
# 文档: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - texlive-latex-recommended
    - texlive-fonts-recommended
    - texlive-latex-extra
    - texlive-lang-chinese
    - latexmk

# 同时构建 HTML 打包、PDF、EPUB（对应页面右下角 Downloads 浮层）
formats:
  - htmlzip
  - pdf
  - epub

sphinx:
  configuration: source/conf.py

python:
  install:
    - requirements: requirements.txt
